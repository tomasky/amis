name: Release SDK (npm)

# 打 tag 时触发：构建 amis 浏览器 SDK，并作为独立包发布到 npm，
# 之后即可通过 jsDelivr 的 npm 通道引用：
#
#   https://cdn.jsdelivr.net/npm/@tomasky/amis@<version>/sdk/sdk.js
#   https://cdn.jsdelivr.net/npm/@tomasky/amis@<version>/sdk/sdk.min.js   # .min 由 jsDelivr 自动生成
#   https://cdn.jsdelivr.net/npm/@tomasky/amis@<version>/sdk/sdk.min.css
#
# 发布包名固定为 @tomasky/amis（写在 packages/amis-sdk/package.json 的 name，CI 不会改动它）；
# 版本以 package.json 为准，仅当由 tag 触发时覆盖为 tag 版本（v6.8.1 -> 6.8.1）。
#
# 说明：sdk 是自包含的整合包，不需要发布 amis / amis-core / amis-ui 等其它包，
# 现有包名一概不动，只发 packages/amis-sdk 这一个只装构建产物的包。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-sdk:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
        run: |
          npm i --legacy-peer-deps
          cd packages/office-viewer
          npm i --legacy-peer-deps
          cd ../../

      - name: Build sdk
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
        run: |
          # sdk 依赖上游各包的 lib 产物（amis build.sh 会从 amis-ui/lib 拷贝主题）
          npm run build --workspace amis-formula
          npm run build --workspace amis-core
          npm run build --workspace amis-ui
          npm run build --workspace amis

      - name: Stage sdk into publish package
        run: |
          rm -rf packages/amis-sdk/sdk
          cp -r packages/amis/sdk packages/amis-sdk/sdk
          ls -lh packages/amis-sdk/sdk

      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: packages/amis-sdk
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Publish to npm
        working-directory: packages/amis-sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
